spring.application.name=RideSharingTrip
server.port=2000

# PostgreSQL (host "postgresdb" = service name in docker-compose.yml)
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DB_URL:jdbc:postgresql://postgresdb:5432/ridesharingdb}
spring.datasource.username=postgres
spring.datasource.password=postgres

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Swagger UI -> http://localhost:2025/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
